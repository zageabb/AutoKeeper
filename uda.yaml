schema_version: 1
application:
  name: autokeeper
  display_name: AutoKeeper
  group: Personal
source:
  branch: main
runtime:
  type: python
  version: "3.10.12"
  working_dir: .
build:
  working_dir: .
  commands:
    - ["python", "-m", "pip", "install", "-r", "requirements.txt"]
service:
  type: systemd
  entrypoint: ["uvicorn", "autokeeper.server:app", "--host", "127.0.0.1", "--port", "5092"]
  port: 5092
  health_path: /health
proxy:
  enabled: true
  path: /apps/autokeeper/
  authentication: uda
environment:
  required:
    - APP_ADMIN_PASSWORD
    - APP_ADMIN_USERNAME
    - AUTOKEEPER_AUTH_MODE
    - AUTOKEEPER_DB_PATH
    - AUTOKEEPER_DEV_NO_AUTH
    - AUTOKEEPER_ROOT_PATH
    - DVLA_API_KEY
    - SMTP_APP_PASSWORD
    - SMTP_FROM
    - SMTP_HOST
    - SMTP_PORT
    - SMTP_USER
deployment:
  auto_update: true
  rollback: true
  github_reporting: false

